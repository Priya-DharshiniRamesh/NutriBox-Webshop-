<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NutriBox - Customer Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            NutriBox
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#products">Products</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
        </nav>

    </header>


    <section class="register-page">

        <div class="register-card">

            <div class="register-icon">
                🥗
            </div>

            <h1>Create Your Account</h1>

            <p class="register-subtitle">
                Register your organization with NutriBox
                and start managing healthy meal orders.
            </p>


            <form id="registrationForm">

                <div class="register-form-group">

                    <label for="organizationName">
                        Organization Name
                    </label>

                    <input
                        type="text"
                        id="organizationName"
                        placeholder="Enter organization name"
                        required
                    >

                </div>


                <div class="register-form-group">

                    <label for="customerType">
                        Customer Type
                    </label>

                    <select id="customerType" required>

                        <option value="">
                            Select customer type
                        </option>

                        <option value="Gym / Fitness Centre">
                            Gym / Fitness Centre
                        </option>

                        <option value="Corporate Office">
                            Corporate Office
                        </option>

                        <option value="College Hostel">
                            College Hostel
                        </option>

                        <option value="Hospital / Wellness Centre">
                            Hospital / Wellness Centre
                        </option>

                        <option value="Hotel / Cafeteria">
                            Hotel / Cafeteria
                        </option>

                        <option value="Sports Academy">
                            Sports Academy
                        </option>

                    </select>

                </div>


                <div class="register-form-group">

                    <label for="contactPerson">
                        Contact Person
                    </label>

                    <input
                        type="text"
                        id="contactPerson"
                        placeholder="Enter contact person name"
                        required
                    >

                </div>


                <div class="register-form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                        required
                    >

                </div>


                <div class="register-form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <div class="register-form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Enter city"
                        required
                    >

                </div>


                <div class="register-form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-button"
                >
                    Create NutriBox Account
                </button>

            </form>


            <p
                id="registrationMessage"
                class="register-message"
            ></p>


            <div class="register-login">

                Already registered?

                <a href="login.html">
                    Login here
                </a>

            </div>


            <div class="register-home">

                <a href="index.html">
                    ← Back to NutriBox Home
                </a>

            </div>

        </div>

    </section>


    <script src="register.js"></script>

</body>

</html>
