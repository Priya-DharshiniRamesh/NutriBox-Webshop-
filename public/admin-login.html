<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NutriBox - Admin Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <div class="logo">
            NutriBox Admin
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#products">
                Products
            </a>

        </nav>

    </header>


    <section class="admin-login-page">

        <div class="admin-login-card">

            <div class="admin-login-icon">
                🔐
            </div>


            <h1>
                Admin Login
            </h1>


            <p class="admin-login-subtitle">
                Login to access the NutriBox
                Business Analytics Dashboard.
            </p>


            <form id="adminLoginForm">


                <div class="admin-login-form-group">

                    <label for="adminUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Enter admin username"
                        required
                    >

                </div>


                <div class="admin-login-form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-login-button"
                >
                    Login to Admin Dashboard
                </button>


            </form>


            <p
                id="loginMessage"
                class="admin-login-message"
            ></p>


            <div class="admin-login-home">

                <a href="index.html">
                    ← Back to NutriBox Home
                </a>

            </div>

        </div>

    </section>


    <script src="admin-login.js"></script>

</body>

</html>
