<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NutriBox - Customer Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            NutriBox
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#products">Products</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <section class="login-page">

        <div class="login-card">

            <div class="login-icon">
                🥗
            </div>

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to your NutriBox account
                and manage your healthy meal orders.
            </p>


            <form id="loginForm">

                <div class="login-form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="login-form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login to NutriBox
                </button>

            </form>


            <p
                id="loginMessage"
                class="login-message"
            ></p>


            <div class="login-register">

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </div>


            <div class="login-home">

                <a href="index.html">
                    ← Back to NutriBox Home
                </a>

            </div>

        </div>

    </section>


    <script src="login.js"></script>

</body>

</html>
